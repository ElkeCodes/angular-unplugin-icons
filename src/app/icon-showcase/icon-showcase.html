<h1>Icon Showcase</h1>
<section>
  <h2>Direct icon elements</h2>
  <ul>
    <li><icon-mono-icons-layers></icon-mono-icons-layers></li>
    <li><icon-ion-logo-web-component class="large-icon"></icon-ion-logo-web-component></li>
    <li><icon-mdi-apple-icloud class="red-icon large-icon"></icon-mdi-apple-icloud></li>
    <li><icon-local-react-logo class="blue-icon"></icon-local-react-logo></li>
    <li><icon-local-vue-logo class="large-icon green-icon"></icon-local-vue-logo></li>
  </ul>
</section>
<section>
  <h2>Using AppIcon component</h2>
  <ul>
    <li><app-icon name="mono-layers" /></li>
    <li><app-icon name="ion-web-component" class="large-icon" /></li>
    <li><app-icon name="mdi-apple-icloud" class="red-icon large-icon" /></li>
    <li><app-icon name="local-react-logo" class="blue-icon" /></li>
    <li><app-icon name="local-vue-logo" class="large-icon green-icon" /></li>
  </ul>
</section>
<section>
  <h2>Using raw SVG</h2>
  <ul>
    <li><span [innerHTML]="alarmOffIcon | safeHtml" aria-hidden="true" class="red-icon"></span></li>
    <li><span [innerHTML]="lightningIcon | safeHtml" aria-hidden="true" class="blue-icon"></span></li>
    <li><span [innerHTML]="gamingIcon | safeHtml" aria-hidden="true" class="green-icon"></span></li>
  </ul>
</section>
